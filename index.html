<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>算力尖塔 · 卡牌构筑 Roguelike</title><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d0b12;--panel:#1a1522;--panel2:#241c2e;--gold:#e8c26a;--red:#d9534f;--blue:#4aa3df;--green:#5cb85c;--txt:#eee4d3;--dim:#9a8f80;--atk:#b0413e;--skl:#2f6f9f;--pow:#c48a1e;--cur:#5a3d6b}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(ellipse at 50% 0%,#2a1d35 0%,#0d0b12 60%)}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.btn{background:linear-gradient(#5a4020,#3a2810);color:var(--gold);border:2px solid #b8913f;border-radius:8px;padding:10px 22px;font-size:17px;font-weight:bold;letter-spacing:1px;box-shadow:0 3px 0 #1a1008,0 0 12px rgba(232,194,106,.15);transition:.12s}
.btn:hover{filter:brightness(1.25);transform:translateY(-1px)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.small{padding:5px 12px;font-size:14px}
.btn.red{background:linear-gradient(#7a2420,#4a1410);border-color:#d96a5f;color:#ffd9cc}
.btn.blue{background:linear-gradient(#20507a,#10304a);border-color:#5fa8d9;color:#d9f0ff}
.topbar{position:absolute;top:0;left:0;right:0;height:44px;background:linear-gradient(#211a2a,#15101b);border-bottom:2px solid #3d2f4a;display:flex;align-items:center;gap:16px;padding:0 12px;z-index:50;font-size:15px}
.topbar .it{display:flex;align-items:center;gap:4px;white-space:nowrap}
.topbar .hp{color:#ff7b72;font-weight:bold}.topbar .gd{color:var(--gold);font-weight:bold}
.topbar .relics{display:flex;gap:2px;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.relic{width:32px;height:32px;border-radius:50%;background:radial-gradient(#3d3050,#1d1626);border:1px solid #8a7340;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative}
.relic .cnt{position:absolute;bottom:-3px;right:-3px;font-size:10px;background:#000;border-radius:6px;padding:0 3px;color:#fff}
.relic.flash{animation:flash .5s}
@keyframes flash{50%{transform:scale(1.4);box-shadow:0 0 14px var(--gold)}}
.potions{display:flex;gap:4px}
.potion{width:30px;height:30px;border-radius:8px;border:1px dashed #555;display:flex;align-items:center;justify-content:center;font-size:18px;background:#120e18}
.potion.has{border:1px solid #6a9;cursor:pointer;background:#1b2a24}
.potion.has:hover{filter:brightness(1.4)}
.screen{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:auto}
.screen.full{top:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:100%;padding:20px;text-align:center}
.title{font-size:clamp(34px,6vw,64px);font-weight:900;color:var(--gold);text-shadow:0 0 20px #a8742a,0 4px 0 #3a2010;letter-spacing:4px}
.sub{color:var(--dim);font-size:15px;max-width:640px;line-height:1.6}
h2{color:var(--gold);font-size:26px;text-shadow:0 2px 0 #000}
.panel{background:linear-gradient(var(--panel2),var(--panel));border:2px solid #4a3a5a;border-radius:12px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.chars{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.charcard{width:300px;cursor:pointer;transition:.15s;text-align:left}
.charcard:hover{transform:translateY(-4px);border-color:var(--gold)}
.charcard .portrait{font-size:72px;text-align:center;filter:drop-shadow(0 0 12px rgba(232,194,106,.4))}
.charcard h3{color:var(--gold);font-size:22px;text-align:center;margin:6px 0}
.charcard p{font-size:14px;line-height:1.55;color:#d6cbb8}
/* cards */
.card{position:relative;width:150px;height:214px;border-radius:12px;padding:6px;flex-shrink:0;cursor:pointer;transition:transform .12s,box-shadow .12s;color:#fff;font-size:13px;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.card.attack{background:linear-gradient(160deg,#c45450,#6e1f1d)}
.card.skill{background:linear-gradient(160deg,#3f8bc4,#1a3d5e)}
.card.power{background:linear-gradient(160deg,#d9a33a,#7a5010)}
.card.curse,.card.status{background:linear-gradient(160deg,#6b4d7d,#2b1d35)}
.card .frame{position:absolute;inset:3px;border-radius:10px;border:3px solid #8a8a8a;pointer-events:none}
.card.common .frame{border-color:#a9a9a9}.card.starter .frame{border-color:#8f8f8f}
.card.uncommon .frame{border-color:#5fb0ff;box-shadow:inset 0 0 8px #5fb0ff88}
.card.rare .frame{border-color:#ffd35a;box-shadow:inset 0 0 12px #ffd35aaa}
.card .cost{position:absolute;top:-8px;left:-8px;width:34px;height:34px;border-radius:50%;background:radial-gradient(#ffe7a0,#d08a1a);color:#2a1800;font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;border:2px solid #fff3c4;z-index:2;text-shadow:none}
.card .cost.cheap{color:#0a6a10}
.card .nm{text-align:center;font-weight:bold;font-size:14px;margin:4px 6px 0 18px;background:rgba(0,0,0,.35);border-radius:6px;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.up .nm{color:#8dff8d}
.card .art{height:64px;margin:4px 8px;border-radius:6px;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:36px;border:1px solid rgba(255,255,255,.15)}
.card .tp{text-align:center;font-size:11px;color:#ddd;margin-top:-2px}
.card .ds{margin:4px 8px;background:rgba(0,0,0,.38);border-radius:6px;padding:5px;min-height:72px;font-size:12.5px;line-height:1.4;text-align:center}
.card .ds b{color:#ffe08a}
.card .ds .mod-up{color:#7dff7d}.card .ds .mod-dn{color:#ff8a8a}
.card.unplay{filter:brightness(.6)}
.card.sel{transform:translateY(-30px) scale(1.08)!important;box-shadow:0 0 20px 5px #ffe08a;z-index:30}
.hand{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;align-items:flex-end;height:240px;width:min(1000px,96vw)}
.hand .card{margin:0 -14px}
.hand .card:hover{transform:translateY(-24px) scale(1.1);z-index:20}
.cardgrid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;padding:10px}
.cardgrid .card:hover{transform:scale(1.06);z-index:5}
/* combat */
.combat{position:absolute;top:44px;left:0;right:0;bottom:0}
.field{position:absolute;top:10px;left:0;right:0;height:calc(100% - 260px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 4vw}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:130px;transition:transform .1s}
.ent .sprite{font-size:84px;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.7));transition:.15s}
.ent.big .sprite{font-size:120px}
.ent .nm{font-size:14px;font-weight:bold;color:#f3e6cf;text-shadow:0 1px 0 #000}
.hpbar{width:130px;height:14px;background:#2a0d0d;border:1px solid #000;border-radius:7px;position:relative;overflow:hidden}
.hpbar .f{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e2534a,#9a221c);transition:width .3s}
.hpbar .pz{position:absolute;top:0;bottom:0;background:#6ac36a;opacity:.85}
.hpbar .t{position:absolute;inset:0;font-size:11px;text-align:center;line-height:13px;font-weight:bold;text-shadow:0 0 2px #000}
.blk{position:absolute;left:-14px;top:50%;transform:translateY(-50%);background:radial-gradient(#7fc2ff,#2a6aa8);border:2px solid #cfe8ff;width:26px;height:26px;border-radius:6px 6px 13px 13px;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:2}
.hpwrap{position:relative}
.hpwrap.hasblk .hpbar{border-color:#7fc2ff;box-shadow:0 0 6px #4aa3df}
.stats{display:flex;flex-wrap:wrap;gap:2px;max-width:150px;justify-content:center;min-height:22px}
.st{font-size:12px;background:rgba(0,0,0,.55);border-radius:5px;padding:1px 4px;border:1px solid #444;cursor:help}
.st.bad{border-color:#a44}.st.good{border-color:#4a4}
.intent{font-size:16px;font-weight:bold;background:rgba(0,0,0,.55);border-radius:8px;padding:2px 8px;border:1px solid #555;min-height:26px;cursor:help;white-space:nowrap}
.intent.atk{color:#ff8a7a;border-color:#a44}
.enemies{display:flex;gap:3vw;align-items:flex-end}
.enemy{cursor:pointer;padding:6px;border-radius:12px}
.targeting .enemy:hover,.enemy.tgt{background:rgba(255,80,60,.15);box-shadow:0 0 0 2px #ff6a5a}
.ent.dead{opacity:0;transform:scale(.6) translateY(30px);pointer-events:none;transition:.5s}
.hit .sprite{animation:hit .3s}
@keyframes hit{20%{transform:translateX(-10px) rotate(-6deg);filter:brightness(2) drop-shadow(0 0 10px red)}60%{transform:translateX(8px)}}
.lunge .sprite{animation:lunge .3s}
@keyframes lunge{40%{transform:translateX(-40px) scale(1.1)}}
.plunge .sprite{animation:plunge .3s}
@keyframes plunge{40%{transform:translateX(40px) scale(1.1)}}
.floater{position:fixed;font-weight:900;font-size:30px;pointer-events:none;z-index:200;text-shadow:0 2px 0 #000,0 0 6px #000;animation:float 1s forwards}
.floater.dmg{color:#ff5a4a}.floater.blkf{color:#7fc2ff}.floater.heal{color:#6f6}.floater.st{color:#ffd35a;font-size:18px}
@keyframes float{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:1;transform:translateY(-10px) scale(1.2)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.energy{position:absolute;left:24px;bottom:150px;width:78px;height:78px;border-radius:50%;background:radial-gradient(#ffe88a,#d07a10 70%,#6a3000);border:3px solid #fff0b0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#2a1000;box-shadow:0 0 24px #ffb84a;z-index:10}
.pile{position:absolute;bottom:40px;width:66px;height:84px;border-radius:8px;background:linear-gradient(#3a2d4a,#1f1729);border:2px solid #6a5580;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;cursor:pointer;z-index:10}
.pile b{font-size:22px;color:var(--gold)}
.pile.draw{left:20px}.pile.disc{right:20px}.pile.exh{right:20px;bottom:136px;height:50px;width:66px}
.endturn{position:absolute;right:110px;bottom:150px;z-index:10}
.turnbanner{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:44px;font-weight:900;color:var(--gold);text-shadow:0 0 20px #000,0 3px 0 #000;pointer-events:none;animation:banner 1s forwards;z-index:100;background:linear-gradient(90deg,transparent,rgba(0,0,0,.6),transparent)}
@keyframes banner{0%{opacity:0;transform:scaleY(0)}20%{opacity:1;transform:scaleY(1)}80%{opacity:1}100%{opacity:0}}
.hint{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:4px 12px;border-radius:8px;font-size:14px;color:#ffd;z-index:20}
/* map */
.mapwrap{position:relative;margin:0 auto;width:min(760px,100vw)}
.mapnode{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:#2a2234;border:2px solid #555;transition:.15s;z-index:2}
.mapnode.avail{border-color:var(--gold);cursor:pointer;animation:pulse 1.2s infinite;background:#3a2e1a}
.mapnode.avail:hover{transform:scale(1.25)}
.mapnode.visited{background:#1e3a26;border-color:#5cb85c;opacity:.85}
.mapnode.cur{box-shadow:0 0 0 4px #5cb85c,0 0 20px #5cb85c}
.mapnode.locked{opacity:.45}
@keyframes pulse{50%{box-shadow:0 0 16px 4px rgba(232,194,106,.7)}}
.maplegend{position:fixed;right:10px;top:56px;font-size:13px;line-height:1.8;z-index:5;background:rgba(20,15,27,.9);padding:8px 12px;border-radius:8px;border:1px solid #4a3a5a}
.maphead{position:sticky;top:0;z-index:4;text-align:center;padding:8px;background:linear-gradient(#0d0b12,rgba(13,11,18,0))}
/* modal */
.modal{position:fixed;inset:0;background:rgba(5,3,8,.86);z-index:150;display:flex;flex-direction:column;align-items:center;padding:20px 10px;overflow:auto;gap:12px}
.modal h2{margin-top:10px}
.tip{position:fixed;z-index:300;max-width:320px;max-height:96vh;overflow:hidden;background:rgba(18,14,24,.97);border:1px solid #8a7340;border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.5;pointer-events:none;box-shadow:0 4px 16px #000}
.tip .k{color:var(--gold);font-weight:bold}
.tip .src{color:#8fb8d9;font-size:11px;margin-top:4px}
.tip .fl{color:#c9b9a0;font-style:italic;margin-top:4px;border-top:1px solid #3a2f45;padding-top:4px}
.rewards{display:flex;flex-direction:column;gap:10px;width:min(420px,92vw)}
.rw{display:flex;align-items:center;gap:10px;background:#2a2234;border:1px solid #5a4a6a;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:16px;text-align:left}
.rw:hover{background:#3a2e48;border-color:var(--gold)}
.rw .ic{font-size:26px}
.shopgrid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;max-width:1000px}
.shopitem{display:flex;flex-direction:column;align-items:center;gap:6px}
.price{color:var(--gold);font-weight:bold}.price.no{color:#a55}
.sold{opacity:.25;pointer-events:none}
.bigrelic{width:80px;height:80px;font-size:42px;border-radius:50%;background:radial-gradient(#4a3a60,#1d1626);border:2px solid #b8913f;display:flex;align-items:center;justify-content:center;cursor:pointer}
.event{max-width:720px;text-align:left}
.event .pic{font-size:80px;text-align:center}
.event p{line-height:1.7;margin:10px 0;color:#e8dcc6}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.opt{background:#2a2234;border:1px solid #6a5580;border-radius:8px;padding:10px 14px;text-align:left;color:var(--txt);font-size:15px}
.opt:hover{border-color:var(--gold);background:#3a2e48}
.opt:disabled{opacity:.4;cursor:not-allowed}
.opt .g{color:#7d7}.opt .r{color:#f88}
.srclist{max-width:900px;text-align:left;line-height:1.7;font-size:14px}
.srclist a{color:#8fc8ff}
.srclist li{margin-left:20px}
.summary td{padding:4px 14px;text-align:left}.summary td:first-child{color:var(--dim)}
.kw{max-width:760px;text-align:left;display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kw .k{color:var(--gold);font-weight:bold}
.factbox{font-size:12.5px;color:#cbbfa8;max-width:640px;line-height:1.6;background:rgba(0,0,0,.3);border-left:3px solid #8a7340;padding:8px 12px;text-align:left}
@media (max-width:820px),(max-height:620px){

}
.combat{background:radial-gradient(ellipse at 50% 85%,rgba(120,70,40,.25),transparent 60%),linear-gradient(180deg,#120d18 0%,#1b1422 55%,#2a1d1a 100%)}
.field::after{content:'';position:absolute;left:3vw;right:3vw;bottom:-6px;height:30px;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);z-index:-1}
.ent .sprite{margin-bottom:4px}
.ent .nm{position:relative;z-index:2;background:rgba(0,0,0,.45);padding:1px 8px;border-radius:8px}
.field{padding-bottom:10px}
.combat::before{content:'';position:absolute;left:0;right:0;top:0;height:62%;pointer-events:none;opacity:.9;
 background:repeating-linear-gradient(90deg,rgba(120,160,255,.035) 0 54px,transparent 54px 64px),repeating-linear-gradient(0deg,rgba(120,255,180,.05) 0 2px,transparent 2px 14px);
 -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
@media (max-width:820px){.topbar{overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;scrollbar-width:none}.topbar>*{flex-shrink:0}}

}
/* ===== 英语学习 / 联动 / 市场事件 ===== */
.card .art{position:relative}
.card .en{position:absolute;left:2px;right:2px;bottom:1px;font-size:9.5px;line-height:1.1;color:#bfe3ff;font-family:system-ui,sans-serif;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 1px #000}
.een{font-size:10.5px;color:#9fd0ff;font-style:italic;margin-top:1px;text-shadow:0 1px 0 #000;position:relative;z-index:2}

.tip .cbtip{margin-top:5px;border-top:1px solid #4a3a2a;padding-top:4px;color:#ffd9a0;font-size:12px;line-height:1.45}

.cbchip{background:rgba(30,22,40,.85);border:1px solid #6a5580;border-radius:12px;padding:2px 8px;font-size:12px;color:#e8dcc6;cursor:help;white-space:nowrap}
.cbchip b{color:var(--gold)}.cbchip.on{border-color:#ffd35a;box-shadow:0 0 8px #ffd35a66}

.vk{font-weight:bold;color:#9fd0ff;font-size:15px}.vc{font-size:11px;color:#c9b9a0;font-weight:normal;margin-left:4px}
.vf{font-style:italic;color:#cfe6ff;font-size:12.5px}.vz{color:#e8dcc6;font-size:13px}.vs{color:#8f8576;font-size:11px;margin-top:2px}

function buildQuiz(){
 const pool=seenEntityTerms().filter(k=>GL[k]);const qs=[];
 const deckIds=new Set((run?run.deck:[]).map(c=>c.id));
 const facts=shuffle(FACTS.filter(f=>deckIds.has(f.id)));
 const terms=shuffle(pool.length>=4?pool:GL_RAW.map(g=>g[0]));
 const other=k=>shuffle(GL_RAW.map(g=>g[0]).filter(x=>x!==k));
 let fi=0,ti=0;
 for(let n=0;n<3;n++){
  const kind=(n===2&&facts[fi])?'fact':pick(['t2z','z2t','t2f']);
  if(kind==='fact'){const f=facts[fi++];qs.push({q:f.q,a:f.a,opts:shuffle([f.a,...f.w]),ex:'出自卡牌「'+CARDS[f.id].n+'」的公开规格。',term:null});continue}
  const k=terms[ti++%terms.length],g=GL[k],ws=other(k).slice(0,3).map(x=>GL[x]);
  if(kind==='t2z')qs.push({q:`「${k}」是什么意思？`,a:g.z,opts:shuffle([g.z,...ws.map(w=>w.z)]),ex:`${k} = ${g.f}`,term:k});
  else if(kind==='z2t')qs.push({q:`哪个英文术语的意思是：「${g.z}」？`,a:k,opts:shuffle([k,...ws.map(w=>w.k)]),ex:`${k} = ${g.f}`,term:k});
  else qs.push({q:`「${k}」的英文全称是？`,a:g.f,opts:shuffle([g.f,...ws.map(w=>w.f)]),ex:`${k}：${g.z}`,term:k});
 }
 return qs;
}

const ROWS=15,COLS=7;
const NODE_IC={m:'⚔️',E:'😈',e:'❓',s:'🛒',r:'🔥',t:'🎁',B:'👑'};
const NODE_CN={m:'普通战斗',E:'精英',e:'事件',s:'商店',r:'休息点',t:'宝箱',B:'Boss'};
function genMap(){
 const N=[];for(let r=0;r<ROWS;r++){N.push([]);for(let c=0;c<COLS;c++)N[r].push(null)}
 const node=(r,c)=>N[r][c]||(N[r][c]={r,c,type:null,next:[],jx:(Math.random()-.5)*26,jy:(Math.random()-.5)*16});
 let starts=[];
 for(let p=0;p<6;p++){
  let c=R(0,COLS-1);if(p===1){while(c===starts[0])c=R(0,COLS-1)}starts.push(c);
  for(let r=0;r<ROWS-1;r++){
   const a=node(r,c);let nc=Math.min(COLS-1,Math.max(0,c+R(-1,1)));
   if(nc===c+1&&N[r][c+1]&&N[r][c+1].next.includes(c))nc=c;
   if(nc===c-1&&N[r][c-1]&&N[r][c-1].next.includes(c))nc=c;
   node(r+1,nc);if(!a.next.includes(nc))a.next.push(nc);c=nc;
  }
 }
 const parents=(r,c)=>r===0?[]:N[r-1].filter(n=>n&&n.next.includes(c));
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const n=N[r][c];if(!n)continue;
  if(r===0){n.type='m';continue}if(r===8){n.type='t';continue}if(r===ROWS-1){n.type='r';continue}
  let t,tries=0;
  do{const x=Math.random()*100;t=x<45?'m':x<66?'e':x<73?'s':x<85?'r':'E';
   if(r<5&&(t==='E'||t==='r'))t='m';if(r===ROWS-2&&t==='r')t='m';
   const ps=parents(r,c);if((t==='E'||t==='r'||t==='s')&&ps.some(p=>p.type===t))t=null;tries++}while(!t&&tries<10);
  n.type=t||'m';}
 // 保证每幕至少 2 个商店
 let shops=N.flat().filter(n=>n&&n.type==='s').length,g=0;
 while(shops<2&&g++<50){const r=R(3,12);const c=pick(N[r].filter(n=>n&&n.type==='m')||[]);if(c&&r!==8){c.type='s';shops++}}
 return N;
}

function showMap(){

 const av=availNodes();const isAv=(r,c)=>av.some(a=>a.r===r&&a.c===c);
 let lines='',nodes='';
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const n=M[r][c];if(!n)continue;const p=pos(r,c);
  const targets=r===ROWS-1?[{r:ROWS,c:3}]:n.next.map(x=>({r:r+1,c:x}));
  for(const t of targets){const q=pos(t.r,t.c);const vis=run.visited.some(v=>v.r===r&&v.c===c)&&(run.visited.some(v=>v.r===t.r&&v.c===t.c));
   lines+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${vis?'#5cb85c':'#5a4a6a'}" stroke-width="${vis?4:2}" stroke-dasharray="${vis?'':'6 6'}"/>`}
  const visited=run.visited.some(v=>v.r===r&&v.c===c),cur=run.pos&&run.pos.r===r&&run.pos.c===c;
  nodes+=`<div class="mapnode ${isAv(r,c)?'avail':''} ${visited?'visited':''} ${cur?'cur':''} ${!isAv(r,c)&&!visited?'locked':''}" style="left:${p.x}px;top:${p.y}px" data-tip="node:${n.type}" ${isAv(r,c)?`onclick="enterNode(${r},${c})"`:''} data-r="${r}" data-c="${c}">${NODE_IC[n.type]}</div>`}

function enterNode(r,c){
 run.pos={r,c};run.visited.push({r,c});run.stats.floors++;

function nativeAct(id){for(const a of [1,2,3]){const P=ENCOUNTERS[a];for(const k of ['easy','hard','elite','boss'])for(const g of P[k])if((Array.isArray(g)?g:[g]).includes(id))return a}return 1}
// 难度系数（游戏设定）：第 2/3 幕敌人生命与伤害下调，用于平衡
const ACT_SC={war:{hp:{2:.74,3:.68},dm:{2:.83,3:.79}},ai:{hp:{2:.78,3:.72},dm:{2:.85,3:.81}},orb:{hp:{2:.7,3:.64},dm:{2:.79,3:.75}}};
function actHp(){const c=ACT_SC[run.char];return (c&&c.hp[run.act])||1}function actDm(){const c=ACT_SC[run.char];return (c&&c.dm[run.act])||1}
function makeEnemy(id){
 const D=ENEMIES[id];const diff=Math.max(0,run.act-nativeAct(id));
 const hp=Math.round(R(D.hp[0],D.hp[1])*(1+0.3*diff)*actHp());
 const e={uid:uid(),id,n:D.n,hp,maxHp:hp,block:0,st:{},t:0,intent:null,dead:false};
 if(diff)e.st.str=diff*2;if(D.init)D.init(e);return e;
}
function startCombat(ids,kind){

 cs={kind,enemies,p:{hp:run.hp,maxHp:run.maxHp,block:0,st:{},uid:'player'},draw:shuffle(run.deck.map(c=>({...c,uid:uid()}))),hand:[],discard:[],exhaust:[],energy:0,turn:0,
  sel:null,selPot:null,anim:{},over:false,busy:false,firstAttackDone:false,attackCount:0,hpLostCards:0,carry:0,launches:[]};
 cs.g=makeG();cs.cb=cbInit();
 markSeen([...new Set(ids.flatMap(id=>termsFor('enemy',id)))]);
 for(const e of enemies)e.intent=ENEMIES[e.id].ai(e,e.t++,cs.g);
 // 开场遗物
 const g=cs.g;
 if(hasRelic('prometheus'))g.self('str',1);
 if(hasRelic('hyperion'))g.rawBlk(10);
 if(hasRelic('cowos'))g.self('dex',1);
 if(hasRelic('reticle'))g.self('art',1);
 if(hasRelic('microchan'))g.self('metal',3);
 if(hasRelic('ironwood'))g.apAll('vuln',1);
 if(hasRelic('turbine'))for(const e of alive())g.dmgRaw(e,3);
 if(hasRelic('groundst'))g.launch({n:'Electron',t:2,d:12,ic:'🚀'});

 banner(kind==='B'?'Boss 战！':kind==='E'?'精英战斗':'战斗开始');

function makeG(){
 const g={

  atkAll(n,times=1,o={}){let tot=0;for(let i=0;i<times;i++)for(const e of alive())tot+=g.atk(e,n,1,{aoe:1,lane:o.lane});return tot},

  steal(e){const s=Math.min(run.gold,e.st.steal||15);run.gold-=s;e.stolen=(e.stolen||0)+s;if(s)float(cs.p,'-'+s+'🪙','dmg')},

  layerTo(n){if((cs.p.st.hbm||0)<n){cs.p.st.hbm=Math.min(16,n);float(cs.p,'🧱HBM '+cs.p.st.hbm+' 层','st')}},
  launch(o){cs.launches.push(Object.assign({uid:uid()},o));float(cs.p,(o.ic||'🚀')+o.n+' T-'+o.t,'st')},

  spend(n){if(run.gold<n)return false;run.gold-=n;float(cs.p,'-'+n+'🪙','dmg');return true},
 };

function exhaustCard(c){cs.exhaust.push(c);if(cs.p.st.fnp)cs.g.rawBlk(cs.p.st.fnp)}
function dealDmg(t,d,opts){

 if(t===cs.p&&hasRelic('vdc800')&&!cs.vdcUsed&&opts.attacker&&d>0){d=Math.max(0,d-4);cs.vdcUsed=1}
 let left=d;if(!opts.pierce&&t.block>0){const b=Math.min(t.block,left);t.block-=b;left-=b}
 t.hp-=left;cs.anim[t.uid]='hit';
 float(t,left>0?'-'+left:(d>0?'格挡':'0'),left>0?'dmg':'blkf');
 if(t!==cs.p)run.stats.dmg+=left;
 if(t===cs.p&&opts.attacker&&opts.attacker!==cs.p&&cs.p.st.thorns&&!opts.attacker.dead){dealDmg(opts.attacker,cs.p.st.thorns,{})}
 if(t!==cs.p&&t.hp<=0)killEnemy(t);

}

 cs.turn++;const p=cs.p,g=cs.g;cs.turnCards=0;cs.turnSkills=0;cs.vdcUsed=0;comboTurn();
 if(!p.st.barricade)p.block=0;
 if(p.st.nextblk){g.rawBlk(p.st.nextblk);delete p.st.nextblk}
 if(p.st.poison){const n=p.st.poison;p.hp-=n;float(p,'-'+n+'☠️','dmg');p.st.poison--;if(!p.st.poison)delete p.st.poison;checkDeath();if(cs.over){renderCombat();return}}

 if(p.st.orbit){const a=alive();if(a.length)dealDmg(pick(a),p.st.orbit,{})}

 if(cs.over||!alive().length){renderCombat();return}

 if(hasRelic('c2c'))en++;

 cs.energy=en;
 let dn=5+(p.st.xdraw||0)+(hasRelic('spectrum')?1:0)+(cs.turn===1&&hasRelic('colossus')?2:0);
 drawCards(dn);cs.busy=false;
 if(p.st.roadmap){const l=cs.hand.filter(canUp);if(l.length){const c=pick(l);c.up=true;float(p,'🗓️升级 '+cname(c),'st')}}

function fireLaunches(manual){
 const g=cs.g,keep=[];
 for(const l of cs.launches){
  if(l.t>0){keep.push(l);continue}
  if(!manual&&l.dc&&l.dl>0&&Math.random()<l.dc){l.dl--;l.t=1;keep.push(l);banner(l.n+' 推迟发射！');continue}
  if(l.fx==='xen'){g.self('xen',l.d);continue}
  if(l.fx==='orbit'){g.self('orbit',l.d);continue}
  const lm=launchMult(),hit=e=>dealDmg(e,Math.floor(l.d*lm*(e.st.vuln?1.5:1)),{});
  if(l.all)alive().forEach(hit);else{const a=alive();if(a.length)hit(pick(a))}
  float(cs.p,(l.ic||'🚀')+l.n+' 发射！','st');
  if(cs.p.st.reuse){g.draw(cs.p.st.reuse);cs.energy++}
 }
 cs.launches=keep;checkWin();
}

async function endTurn(){
 if(cs.busy||(!cs||cs.over))return;cs.busy=true;cs.sel=null;cs.selPot=null;const p=cs.p,g=cs.g;

  const m=ENEMIES[e.id].moves[e.intent];
  cs.anim[e.uid]='lunge';
  if(m.d){const times=m.x||1;for(let k=0;k<times;k++){if((!cs||cs.over)||e.dead)break;const dmg=calcEnemyDmg(e,m.d);dealDmg(p,dmg,{attacker:e});renderCombat();await sleep(times>1?180:120)}}
  if(!cs||cs.over)return;
  if(m.b&&!e.dead){e.block+=m.b;float(e,'+'+m.b+'🛡️','blkf')}
  if(m.fn&&!e.dead)m.fn(g,e);
  renderCombat();await sleep(380);
 }
 if((!cs||cs.over))return;

 // 回合结束结算

function winCombat(){
 run.hp=Math.max(1,cs.p.hp);
 if(hasRelic('ember')){run.hp=Math.min(run.maxHp,run.hp+6)}
 const kind=cs.kind;const rw=[];
 let gold=kind==='m'?R(10,20):kind==='E'?R(25,35):R(95,105);if(hasRelic('ledger'))gold+=12;
 rw.push({t:'gold',n:gold});
 if(kind==='E'){run.stats.elites++;rw.push({t:'relic',id:randomRelic()})}
 if(kind==='B')run.stats.bosses++;
 if(Math.random()<(kind==='m'?0.4:0.6))rw.push({t:'potion',id:pick(Object.keys(POTIONS))});
 rw.push({t:'cards',cards:cardChoices(kind)});
 rw.push({t:'quiz',en:cs.enemies.map(e=>e.id)});
 if(cs.bonusRelic)rw.push({t:'relic',id:randomRelic()});
 if(kind==='B'&&run.act<3)rw.push({t:'bossrelic',ids:shuffle(Object.keys(RELICS).filter(k=>RELICS[k].r==='boss'&&!run.relics.includes(k))).slice(0,3)});
 cs=null;
 if(kind==='B'&&run.act===3){for(const r of rw)if(r.t==='gold')run.gold+=r.n;return endRun(true,'击败了十年期利率，登顶算力尖塔')}
 run.rewards=rw;showRewards();
}
function cardChoices(kind){
 const pool=Object.values(CARDS).filter(c=>c.c===run.char&&['common','uncommon','rare'].includes(c.r));
 const out=[];let guard=0;
 while(out.length<3&&guard++<100){
  const x=Math.random();const rar=kind==='B'?'rare':kind==='E'?(x<.12?'rare':x<.5?'uncommon':'common'):(x<.06?'rare':x<.4?'uncommon':'common');
  const opts=pool.filter(c=>c.r===rar&&!out.some(o=>o.id===c.id));if(!opts.length)continue;
  const c=pick(opts);out.push(newCard(c.id,Math.random()<(run.act-1)*0.12));
 }
 return out;
}
function randomRelic(){
 const opts=Object.keys(RELICS).filter(k=>['common','uncommon','rare'].includes(RELICS[k].r)&&!run.relics.includes(k));
 return opts.length?pick(opts):null;
}

  if(r.t==='potion')return `<div class="rw" id="rw-${i}" onclick="takeRw(${i})" data-tip="potion:${r.id}"><span class="ic">${POTIONS[r.id].i}</span>${POTIONS[r.id].n}</div>`;
  if(r.t==='relic'&&r.id)return `<div class="rw" id="rw-${i}" onclick="takeRw(${i})" data-tip="relic:${r.id}"><span class="ic">${RELICS[r.id].i}</span>遗物：${RELICS[r.id].n}</div>`;
  if(r.t==='cards')return `<div class="rw" id="rw-${i}" onclick="takeRw(${i})"><span class="ic">🂠</span>选择一张卡牌加入牌组</div>`;
  if(r.t==='quiz')return `<div class="rw quizrw" id="rw-${i}" data-quiz="1" onclick="takeRw(${i})"><span class="ic">📝</span>英语小测（可选，3 题：每题 +10 金币，全对再升级 1 张牌）</div>`;
  if(r.t==='bossrelic')return `<div class="rw" id="rw-${i}" onclick="takeRw(${i})"><span class="ic">👑</span>选择一件 Boss 遗物</div>`;
  return '';}).join('');
 app().innerHTML=topbar()+`<div class="screen"><div class="center"><h2>🏆 战斗胜利</h2><div class="panel rewards">${items||'<div class="sub">奖励已全部领取</div>'}</div>

}
function takeRw(i){
 const r=run.rewards[i];
 if(r.t==='gold'){run.gold+=r.n;run.stats.gold+=r.n}
 else if(r.t==='potion'){if(!addPotion(r.id)){shakeMsg('药水栏已满（可先丢弃一瓶）');return}}
 else if(r.t==='relic')gainRelic(r.id);
 else if(r.t==='quiz'){run.rewards.splice(i,1);QZ_EN=r.en||[];startQuiz(()=>showRewards());return}
 else if(r.t==='cards'){
  modal(`<h2>选择一张卡牌</h2><div class="cardgrid">${r.cards.map((c,j)=>cardHTML(c,{attr:`onclick="chooseRwCard(${i},${j})" data-choice="${j}"`})).join('')}</div><button class="btn" id="skip-card" onclick="closeModal()">跳过</button>`);return}

  modal(`<h2>选择一件 Boss 遗物</h2><div style="display:flex;gap:30px">${r.ids.map(id=>`<div class="shopitem"><div class="bigrelic" data-tip="relic:${id}" onclick="chooseBossRelic(${i},'${id}')">${RELICS[id].i}</div><div>${RELICS[id].n}</div><div class="sub" style="max-width:180px">${RELICS[id].d}</div></div>`).join('')}</div><button class="btn" onclick="closeModal()">稍后</button>`);return}
 run.rewards.splice(i,1);showRewards();
}

   {t:'订一个 Electron 整流罩',d:'花 80 金币，获得遗物「Electron 整流罩」（药水栏 +1）',ok:()=>run.gold>=80&&!run.relics.includes('electron'),fn:()=>{run.gold-=80;gainRelic('electron');return '小而稳定，也是一种答案。'}},

   {t:'逛展台',d:'获得一瓶随机药水',fn:()=>{const p=pick(Object.keys(POTIONS));return addPotion(p)?'领到了「'+POTIONS[p].n+'」。':'药水栏满了，你空手而归。'}}]},
 {id:'spring',n:'冷却塔之泉',pic:'⛲',txt:'冷却塔下有一汪清水，整座液冷机房的热量最终都流到这里。传说饮下它能治愈一切，但会让人背上维护债务。',

  opts:[{t:'献祭',d:'失去 5 最大生命，获得一件随机遗物',fn:()=>{run.maxHp-=5;run.hp=Math.min(run.hp,run.maxHp);const id=randomRelic();gainRelic(id);return id?'获得「'+RELICS[id].n+'」。':'神龛沉默了。'}},
   {t:'净化',d:'花 40 金币，移除一张诅咒（若有）',ok:()=>run.gold>=40&&run.deck.some(c=>CARDS[c.id].t==='curse'),fn:()=>{run.gold-=40;const i=run.deck.findIndex(c=>CARDS[c.id].t==='curse');run.deck.splice(i,1);return '技术债被一笔勾销。'}},

].concat(MKT_EVENTS);
function showEvent(){
 let pool=EVENTS.filter(e=>!run.seenEvents.includes(e.id));if(!pool.length){run.seenEvents=[];pool=EVENTS}
 const mk=pool.filter(e=>e.mk);const ev=(mk.length&&Math.random()<.5)?pick(mk):pick(pool);run.seenEvents.push(ev.id);run.curEvent=ev.id;renderEvent(ev);
}
function renderEvent(ev,result){
 app().innerHTML=topbar()+`<div class="screen"><div class="center"><div class="panel event"><div class="pic">${ev.pic}</div>${ev.mk?'<div class="mktag">📈 真实市场事件</div>':''}<h2>${ev.n}</h2><p>${ev.txt}</p>${ev.mech?`<div class="mech">🔁 <b>传导机制</b>：${ev.mech}<br><span style="color:#d9a35a;font-size:12px">教育用途，非投资建议。</span></div>`:''}
 ${ev.src?`<div class="factbox">📚 ${ev.src.map(s=>`<a href="${SRC[s].u}" target="_blank" style="color:#8fc8ff">${esc(SRC[s].t)}</a>`).join('<br>')}</div>`:''}
 ${result?`<p style="color:var(--gold)">${esc(result)}</p><div class="opts"><button class="opt" id="ev-continue" onclick="showMap()">继续</button></div>`:
 `<div class="opts">${ev.opts.map((o,i)=>`<button class="opt" data-ev="${i}" onclick="chooseEvent(${i})" ${o.ok&&!o.ok()?'disabled':''}><b>【${o.t}】</b> ${o.d}</button>`).join('')}</div>`}</div></div></div>`;
}
function chooseEvent(i){
 const ev=EVENTS.find(e=>e.id===run.curEvent);const res=ev.opts[i].fn();
 if(run.hp<=0){run.hp=0;return endRun(false,'在事件「'+ev.n+'」中倒下')}
 if(res==='__upgrade'){const l=run.deck.filter(canUp);if(!l.length)return renderEvent(ev,'没有可升级的牌。');return pickCard(l,'选择要升级的牌',c=>{c.up=true;renderEvent(ev,'升级了「'+cname(c)+'」。')},false)}
 if(res==='__remove')return pickCard(run.deck,'选择要移除的牌',c=>{run.deck.splice(run.deck.indexOf(c),1);renderEvent(ev,'移除了「'+cname(c)+'」。')},false);
 if(res==='__transform')return pickCard(run.deck,'选择要替换的牌',c=>{run.deck.splice(run.deck.indexOf(c),1);const n=randomCardOf();run.deck.push(n);renderEvent(ev,'「'+cname(c)+'」变成了「'+cname(n)+'」。')},false);
 if(res==='__fight'){startCombat(pick(ENCOUNTERS[run.act].elite),'E');cs.bonusRelic=1;return}
 renderEvent(ev,res);
}
// ===== 启动 =====
window.addEventListener('error',e=>{console.error('JSERR',e.message)});
showTitle();
</script></body></html>
